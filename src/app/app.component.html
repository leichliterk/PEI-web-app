<div class="min-h-screen  relative">
  <!-- Subtle texture overlay -->
  <div class="absolute inset-0  pointer-events-none"></div>

  <p-toolbar class="bg-primary-500 border-none rounded-none shadow-md">
    <ng-template pTemplate="start">
      <h1 class="m-0 text-2xl font-semibold cursor-pointer" (click)="navigateToHome()">PEI Data Services</h1>
      @if (!environment.production) {
        <span class="ml-4 text-red-500 font-bold uppercase">{{ environment.env_name }}</span>
      }
    </ng-template>

    <ng-template pTemplate="end">
      <div class="flex gap-2 items-center">
        @if (isAuthenticated$ | async) {
          <p-button
            icon="pi pi-home"
            [text]="true"
            [rounded]="true"
            severity="secondary"
            (onClick)="navigateToHome()"
            aria-label="Home">
          </p-button>
          <p-button
            icon="pi pi-cog"
            [text]="true"
            [rounded]="true"
            severity="secondary"
            (onClick)="navigateToSettings()"
            aria-label="Settings">
          </p-button>
          @if (userInitials) {
            <div
              class="flex items-center justify-center w-10 h-10 rounded-full bg-white/20 text-white font-semibold text-sm cursor-pointer transition-colors duration-200 select-none hover:bg-white/30"
              (click)="toggleProfileMenu($event)"
              aria-label="Profile Menu">
              {{ userInitials }}
            </div>
            <p-menu #profileMenu [model]="profileMenuItems" [popup]="true"></p-menu>
          }
        } @else {
          <p-button
            label="Log In"
            icon="pi pi-sign-in"
            (onClick)="login()"
            severity="secondary"
            [outlined]="true">
          </p-button>
        }
      </div>
    </ng-template>
  </p-toolbar>

  <main class="px-8 py-12 flex justify-center items-start min-h-[calc(100vh-140px)] relative z-10">
    <router-outlet></router-outlet>
  </main>
</div>
