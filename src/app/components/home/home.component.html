<div class="px-4 py-8">
  <div class="w-[1200px] mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-white m-0">Sites</h2>
      <div class="flex items-center gap-3">
        <div (click)="openSortMenu($event)" style="display: inline-flex">
          <p-button
            label="Sort by"
            icon="pi pi-sort-alt"
            iconPos="right"
            [text]="true"
            severity="secondary">
          </p-button>
        </div>
        <p-menu #sortMenu [popup]="true" [model]="sortMenuItems" [appendTo]="'body'"></p-menu>
        <p-button
          icon="pi pi-th-large"
          [text]="true"
          [rounded]="true"
          [severity]="layout === 'grid' ? 'primary' : 'secondary'"
          (onClick)="layout = 'grid'"
          pTooltip="Grid view">
        </p-button>
        <p-button
          icon="pi pi-bars"
          [text]="true"
          [rounded]="true"
          [severity]="layout === 'list' ? 'primary' : 'secondary'"
          (onClick)="layout = 'list'"
          pTooltip="List view">
        </p-button>
      </div>
    </div>

    @if (loading) {
      <div class="flex justify-center items-center py-12">
        <p-progressSpinner
          strokeWidth="4"
          animationDuration="1s"
          ariaLabel="Loading sites">
        </p-progressSpinner>
      </div>
    } @else {
      @if (layout === 'grid') {
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          @for (site of sortedSites; track site.site_id) {
            <app-site-card [siteData]="site" [layout]="layout" [reading]="readings[site.site_id]"></app-site-card>
          }
        </div>
      } @else {
        <div class="flex flex-col gap-2">
          @for (site of sortedSites; track site.site_id) {
            <app-site-card class="w-full" [siteData]="site" [layout]="layout" [reading]="readings[site.site_id]"></app-site-card>
          }
        </div>
      }
    }
  </div>
</div>
