<div class="max-w-lg mx-auto py-8 px-4">

  <div class="mb-8">
    <h2 class="text-2xl font-semibold m-0">Inspections</h2>
    <p class="text-muted-color mt-1 mb-0">Select an inspection type to begin</p>
  </div>

  <div class="flex flex-col gap-4">

    <button
      class="w-full text-left rounded-xl border border-surface-200 bg-surface-0 hover:bg-surface-50 active:bg-surface-100 transition-colors p-6 flex items-center gap-5 cursor-pointer"
      (click)="goWeekly()">
      <div class="w-14 h-14 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
        <i class="pi pi-calendar text-blue-600 text-2xl"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-base font-semibold">Weekly Inspection</div>
        <div class="text-sm text-muted-color mt-0.5">Skid/Flare weekly examination</div>
      </div>
      <i class="pi pi-chevron-right text-muted-color"></i>
    </button>

    <button
      class="w-full text-left rounded-xl border border-surface-200 bg-surface-0 hover:bg-surface-50 active:bg-surface-100 transition-colors p-6 flex items-center gap-5 cursor-pointer opacity-50"
      disabled>
      <div class="w-14 h-14 rounded-full bg-surface-100 flex items-center justify-center flex-shrink-0">
        <i class="pi pi-calendar-plus text-muted-color text-2xl"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-base font-semibold">Monthly Inspection</div>
        <div class="text-sm text-muted-color mt-0.5">Coming soon</div>
      </div>
      <i class="pi pi-chevron-right text-muted-color"></i>
    </button>

  </div>

</div>
