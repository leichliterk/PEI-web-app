<p-toast></p-toast>

<div class="px-4 py-8">
  <div class="w-[1200px] mx-auto">

    <div class="flex justify-between items-center mb-6">
      <div>
        <h2 class="text-2xl font-semibold m-0">Site Management</h2>
        <p class="text-muted-color mt-1 mb-0">Control site services and FTP operations</p>
      </div>
      <div class="flex items-center gap-2">
        <p-button
          icon="pi pi-th-large"
          [text]="true"
          [rounded]="true"
          [severity]="layout === 'grid' ? 'primary' : 'secondary'"
          (onClick)="layout = 'grid'"
          pTooltip="Grid view">
        </p-button>
        <p-button
          icon="pi pi-bars"
          [text]="true"
          [rounded]="true"
          [severity]="layout === 'list' ? 'primary' : 'secondary'"
          (onClick)="layout = 'list'"
          pTooltip="List view">
        </p-button>
      </div>
    </div>

    @if (loading) {
      <div class="flex justify-center items-center py-12">
        <p-progressSpinner strokeWidth="4" animationDuration="1s"></p-progressSpinner>
      </div>
    } @else {
      @if (layout === 'grid') {
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          @for (site of sites; track site.site_id) {
            <app-site-mgmt-card
              [site]="site"
              [siteStatus]="serviceStatuses[site.site_id]"
              [latestOtaVersion]="latestOtaVersion"
              [restartLoading]="restartLoadingSites.has(site.site_id)"
              [installLoading]="installLoadingSites.has(site.site_id)"
              (restartService)="onRestartService($event)"
              (installOta)="onInstallOta($event)">
            </app-site-mgmt-card>
          }
        </div>
      } @else {
        <div class="flex flex-col gap-2">
          @for (site of sites; track site.site_id) {
            <app-site-mgmt-card
              class="w-full"
              [site]="site"
              [siteStatus]="serviceStatuses[site.site_id]"
              [latestOtaVersion]="latestOtaVersion"
              [restartLoading]="restartLoadingSites.has(site.site_id)"
              [installLoading]="installLoadingSites.has(site.site_id)"
              (restartService)="onRestartService($event)"
              (installOta)="onInstallOta($event)">
            </app-site-mgmt-card>
          }
        </div>
      }
    }

  </div>
</div>
