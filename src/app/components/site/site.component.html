<p-card class="site-card">
  <ng-template pTemplate="header">
    <div class="flex justify-between items-center p-4">
      <h3 class="text-xl font-semibold m-0">{{ siteData.name }}</h3>
      <p-badge
        [severity]="siteData.connection_status ? 'success' : 'danger'"
        [value]="siteData.connection_status ? 'Online' : 'Offline'">
      </p-badge>
    </div>
  </ng-template>

  <div class="text-muted-color">
    <p class="m-0"><strong>Site ID:</strong> {{ siteData.site_id }}</p>
  </div>
</p-card>
