<p-toast></p-toast>

<div class="max-w-2xl mx-auto py-8 px-4">

  <div class="mb-6">
    <h2 class="text-2xl font-semibold m-0">Edit User</h2>
    <p class="text-muted-color mt-1 mb-0">{{ form.email }}</p>
  </div>

  <div class="flex flex-col gap-5">

    <!-- Name row -->
    <div class="flex gap-4">
      <div class="flex flex-col gap-1 flex-1">
        <label class="text-sm font-medium">First Name <span class="text-red-500">*</span></label>
        <input pInputText [(ngModel)]="form.fname" placeholder="First name" class="w-full" />
      </div>
      <div class="flex flex-col gap-1 flex-1">
        <label class="text-sm font-medium">Last Name <span class="text-red-500">*</span></label>
        <input pInputText [(ngModel)]="form.lname" placeholder="Last name" class="w-full" />
      </div>
    </div>

    <!-- Email (read-only) -->
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Email</label>
      <input pInputText [ngModel]="form.email" [disabled]="true" class="w-full opacity-60" />
    </div>

    <!-- Role -->
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Role</label>
      @if (canEditRole) {
        <p-select
          [(ngModel)]="form.role"
          [options]="roleOptions"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          fluid>
        </p-select>
      } @else {
        <span class="text-sm py-2">{{ roleLabel(form.role) }}</span>
      }
    </div>

    <!-- Status -->
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Status</label>
      <p-select
        [(ngModel)]="form.status"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        fluid>
      </p-select>
    </div>

    <!-- Sites -->
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Sites</label>
      <p-multiselect
        [(ngModel)]="form.site_ids"
        [options]="sites"
        optionLabel="name"
        optionValue="site_id"
        placeholder="Select sites"
        appendTo="body"
        [filter]="true"
        filterPlaceholder="Search sites"
        fluid>
      </p-multiselect>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-2 pt-2">
      <p-button
        label="Cancel"
        severity="secondary"
        [text]="true"
        (onClick)="cancel()">
      </p-button>
      <p-button
        label="Save"
        icon="pi pi-check"
        [disabled]="!formValid"
        [loading]="saving"
        (onClick)="save()">
      </p-button>
    </div>

  </div>
</div>
